<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 Exploit Host by Ali games</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Mengatur latar belakang video MP4 bergerak */
  #bg-video {
    position: fixed;
    right: 0;
    bottom: 0;
    min-width: 100%;
    min-height: 100%;
    z-index: -1;
    object-fit: cover;
  }

  /* Layout kontainer 2 kolom (Kiri: Gambar, Kanan: Menu) */
  .main-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 50px;
    position: relative;
    z-index: 1;
    min-height: 80vh;
  }

  /* Pengaturan Gambar di sebelah Kiri */
  .left-box img {
    max-width: 350px;
    width: 100%;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
  }

  /* Pengaturan Teks & Tombol di sebelah Kanan */
  .right-box {
    text-align: right;
  }

  /* Mengubah warna teks pesan agar terlihat jelas */
  #msgs {
    color: #ffffff;
    text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
    margin-top: 10px;
    font-weight: bold;
  }
</style>
</head>
<body>

<!-- Element Video Bergerak -->
<video autoplay muted loop playsinline id="bg-video">
  <source src="gambar-gerak.mp4" type="video/mp4">
</video>

<script>
  var histlength = history.length;
  if(histlength > 1) {
    history.go(-histlength + 2);
  }
</script>

<div class="main-container">
  <!-- Sisi Kiri: Gambar -->
  <div class="left-box">
    <img src="img.jpg" alt="PS4 Controller">
  </div>

  <!-- Sisi Kanan: Pesan & Menu -->
  <div class="right-box">
    <p id="msgs"></p>
    <br>
    <div id="menu">
      <button class="btn btn-multi" 
              onmouseover="document.getElementById('msgs').innerHTML='PS4 GoldHEN Host for 5.05 and 7.00 to 13.00 FW - (Auto Exploit Selection)'" 
              onmouseout="document.getElementById('msgs').innerHTML=''" 
              onclick="location.replace('g2all/index.html')"> 
        GoldHEN Multi FW 
      </button>
    </div>
  </div>
</div>

</body>
</html>
