<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 Exploit Host by Ali games</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Container pembungkus vertikal (tombol di atas, animasi di bawahnya) */
  .btn-container {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 15px; /* Jarak antara tombol dan animasi */
  }

  /* Styling tombol panjang */
  .btn-long {
    width: 250px; /* Tombol dibuat lebih panjang secara horizontal */
    padding: 12px 20px;
    text-align: center;
  }

  /* Styling animasi di bawah tombol: diperbesar tinggi/panjangnya ke bawah */
  .btn-anim {
    width: 250px;  /* Lebar disamakan dengan tombol */
    height: 60vh;  /* Menggunakan 60% tinggi layar agar memanjang signifikan ke bawah */
    min-height: 350px; /* Batas tinggi minimal */
    object-fit: cover;
    border-radius: 8px;
    pointer-events: none;
  }
</style>
</head>
<body>
<script>
  var histlength = history.length;
  if(histlength > 1) {
    history.go(-histlength + 2);
  }
</script>

<div style="margin-top: 50px; text-align: right; padding-right: 50px;">
  <h1 id="msgs">PS4 Exploit Host by Ali games</h1>
  <br>
  <div id="menu">
    <!-- Container untuk menyusun tombol & animasi secara vertikal -->
    <div class="btn-container">
      <!-- Tombol hanya berisi teks GoldHEN -->
      <button class="btn btn-long" onmouseover="msgs.innerHTML='PS4 GoldHEN Host for 5.05 and 7.00 to 13.00 FW - (Auto Exploit Selection)'" onmouseout="msgs.innerHTML='PS4 Exploit Host by Ali games'" onclick="location.replace('g2all/index.html')">
        <span>GoldHEN Multi FW</span>
      </button>

      <!-- Video animasi memanjang ke bawah -->
      <video class="btn-anim" autoplay loop muted playsinline>
        <source src="gambar-gerak.mp4" type="video/mp4">
      </video>

      <!-- Jika menggunakan GIF: -->
      <!-- <img src="gambar-gerak.gif" class="btn-anim" alt="PS Animation"> -->
    </div>
  </div>
</div>

</body>
</html>
